  <script>
    // Aplica tema y tamaño de letra antes de pintar para evitar parpadeo.
    try {
      var p = JSON.parse(localStorage.getItem('ct:prefs') || '{}');
      if (p.tema === 'claro' || p.tema === 'oscuro') document.documentElement.dataset.theme = p.tema;
      if (p.tamanoLetra) document.documentElement.style.fontSize = p.tamanoLetra + 'px';
    } catch (e) {}
  </script>
  <script type="module" src="src/app.js"></script>
</head>
